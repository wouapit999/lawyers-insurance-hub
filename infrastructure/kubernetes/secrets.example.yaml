# ---------------------------------------------------------------------------
# Secrets — EXAMPLE ONLY. Never commit a filled-in copy of this file.
#
# In every deployed environment, secrets come from Azure Key Vault through the
# Secrets Store CSI driver. The SecretProviderClass below is the real
# mechanism; the plain Secret at the bottom exists only as a documented
# fallback for a local kind/minikube cluster.
#
# Why the CSI driver rather than `kubectl create secret`:
#   * The value lives in Key Vault, which has its own access log. "Who read
#     the JWT signing key" is answerable.
#   * Rotation in Key Vault propagates without a redeploy.
#   * The secret never passes through a developer's shell history, a CI log,
#     or this repository.
# ---------------------------------------------------------------------------

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: lih-keyvault
  namespace: lih-production
spec:
  provider: azure
  # Mirrors the mounted values into a Kubernetes Secret so the container can
  # consume them with envFrom.
  secretObjects:
    - secretName: lih-api-secrets
      type: Opaque
      data:
        - { objectName: database-url,        key: DATABASE_URL }
        - { objectName: redis-url,           key: REDIS_URL }
        - { objectName: jwt-access-secret,   key: JWT_ACCESS_SECRET }
        - { objectName: jwt-refresh-secret,  key: JWT_REFRESH_SECRET }
        - { objectName: pii-encryption-key,  key: PII_ENCRYPTION_KEY }
        - { objectName: storage-connection,  key: AZURE_STORAGE_CONNECTION_STRING }
        - { objectName: om-client-id,        key: ORANGE_MONEY_CLIENT_ID }
        - { objectName: om-client-secret,    key: ORANGE_MONEY_CLIENT_SECRET }
        - { objectName: om-merchant-key,     key: ORANGE_MONEY_MERCHANT_KEY }
        - { objectName: om-webhook-secret,   key: ORANGE_MONEY_WEBHOOK_SECRET }
        - { objectName: momo-subscription,   key: MTN_MOMO_SUBSCRIPTION_KEY }
        - { objectName: momo-api-user,       key: MTN_MOMO_API_USER }
        - { objectName: momo-api-key,        key: MTN_MOMO_API_KEY }
        - { objectName: momo-webhook-secret, key: MTN_MOMO_WEBHOOK_SECRET }
        - { objectName: cinetpay-api-key,    key: CINETPAY_API_KEY }
        - { objectName: cinetpay-site-id,    key: CINETPAY_SITE_ID }
        - { objectName: cinetpay-webhook,    key: CINETPAY_WEBHOOK_SECRET }
        - { objectName: smtp-url,            key: SMTP_URL }
        - { objectName: sms-provider-key,    key: SMS_PROVIDER_KEY }
        - { objectName: appinsights-conn,    key: APPLICATIONINSIGHTS_CONNECTION_STRING }

  parameters:
    usePodIdentity: 'false'
    useVMManagedIdentity: 'false'
    # Workload identity: the pod's service account is federated with an Entra
    # ID application. No credential is stored anywhere in the cluster.
    clientID: __AZURE_WORKLOAD_IDENTITY_CLIENT_ID__
    keyvaultName: lih-kv-production
    tenantId: __AZURE_TENANT_ID__
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: redis-url
          objectType: secret
        - |
          objectName: jwt-access-secret
          objectType: secret
        - |
          objectName: jwt-refresh-secret
          objectType: secret
        - |
          objectName: pii-encryption-key
          objectType: secret
        - |
          objectName: storage-connection
          objectType: secret
        - |
          objectName: om-client-id
          objectType: secret
        - |
          objectName: om-client-secret
          objectType: secret
        - |
          objectName: om-merchant-key
          objectType: secret
        - |
          objectName: om-webhook-secret
          objectType: secret
        - |
          objectName: momo-subscription
          objectType: secret
        - |
          objectName: momo-api-user
          objectType: secret
        - |
          objectName: momo-api-key
          objectType: secret
        - |
          objectName: momo-webhook-secret
          objectType: secret
        - |
          objectName: cinetpay-api-key
          objectType: secret
        - |
          objectName: cinetpay-site-id
          objectType: secret
        - |
          objectName: cinetpay-webhook
          objectType: secret
        - |
          objectName: smtp-url
          objectType: secret
        - |
          objectName: sms-provider-key
          objectType: secret
        - |
          objectName: appinsights-conn
          objectType: secret

---
# ---------------------------------------------------------------------------
# LOCAL DEVELOPMENT ONLY.
#
# Do not apply this to any shared cluster. Generate the values with:
#
#   node -e "console.log(require('crypto').randomBytes(48).toString('base64'))"
#
# and populate them from your shell, never by editing this file:
#
#   kubectl create secret generic lih-api-secrets \
#     --namespace lih-dev \
#     --from-literal=JWT_ACCESS_SECRET="$(...)" \
#     --from-literal=PII_ENCRYPTION_KEY="$(...)"
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: lih-api-secrets
  namespace: lih-dev
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://lih:CHANGE_ME@postgres:5432/lih?schema=public&sslmode=require'
  REDIS_URL: 'redis://redis:6379'
  JWT_ACCESS_SECRET: 'REPLACE_WITH_48_RANDOM_BYTES_BASE64'
  JWT_REFRESH_SECRET: 'REPLACE_WITH_A_DIFFERENT_48_RANDOM_BYTES_BASE64'
  PII_ENCRYPTION_KEY: 'REPLACE_WITH_32_RANDOM_BYTES_BASE64'
  AZURE_STORAGE_CONNECTION_STRING: ''
  ORANGE_MONEY_CLIENT_ID: ''
  ORANGE_MONEY_CLIENT_SECRET: ''
  ORANGE_MONEY_MERCHANT_KEY: ''
  ORANGE_MONEY_WEBHOOK_SECRET: ''
  MTN_MOMO_SUBSCRIPTION_KEY: ''
  MTN_MOMO_API_USER: ''
  MTN_MOMO_API_KEY: ''
  MTN_MOMO_WEBHOOK_SECRET: ''
  CINETPAY_API_KEY: ''
  CINETPAY_SITE_ID: ''
  CINETPAY_WEBHOOK_SECRET: ''
  SMTP_URL: ''
  SMS_PROVIDER_KEY: ''
  APPLICATIONINSIGHTS_CONNECTION_STRING: ''
