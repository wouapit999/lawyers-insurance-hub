apiVersion: apps/v1
kind: Deployment
metadata:
  name: lih-api
  namespace: lih-production
  labels:
    app: lih-api
    tier: backend
spec:
  # Three replicas across three availability zones. Two would survive a node
  # failure but leave no headroom during a rolling update; three keeps two
  # serving while one is replaced.
  replicas: 3
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # Never take capacity below the current replica count during a rollout.
      # Renewal day is the worst possible time to discover otherwise.
      maxUnavailable: 0

  selector:
    matchLabels:
      app: lih-api

  template:
    metadata:
      labels:
        app: lih-api
        tier: backend
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '3000'
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: lih-api
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      # Spread replicas across zones so a single-zone outage cannot take the
      # whole API down. South Africa North has three zones.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: lih-api

      containers:
        - name: api
          image: lihacr.azurecr.io/lih-api:production
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']

          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: '3000'
            - name: API_PREFIX
              value: v1
            - name: DEFAULT_LOCALE
              value: fr
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

          # Every secret comes from Azure Key Vault through the CSI driver and
          # is surfaced as a Kubernetes Secret. Nothing sensitive is written
          # into this manifest, which is why this file is safe in git.
          envFrom:
            - secretRef:
                name: lih-api-secrets
            - configMapRef:
                name: lih-api-config

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              # No CPU limit on purpose: CFS throttling under a burst adds
              # latency to exactly the requests we care about. The request
              # guarantees a floor; the HPA handles sustained load.
              memory: 1Gi

          # Liveness must not touch the database. A Postgres blip should not
          # get every pod killed and restarted, which converts a brief
          # dependency problem into a full outage.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Readiness does check the database, so a pod that cannot reach it
          # is pulled from the Service until it can.
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Covers the slow first boot: Prisma engine warm-up plus the
          # connection pool.
          startupProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets-store
              mountPath: /mnt/secrets
              readOnly: true

          lifecycle:
            preStop:
              # Let the load balancer stop sending traffic before the process
              # begins shutting down; without this, in-flight payment webhooks
              # can be dropped mid-request.
              exec:
                command: ['sh', '-c', 'sleep 10']

      # Long enough for an in-flight mobile-money verification to finish.
      terminationGracePeriodSeconds: 60

      volumes:
        - name: tmp
          emptyDir: {}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: lih-keyvault

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lih-api
  namespace: lih-production
  annotations:
    # Workload identity — the pod authenticates to Key Vault and Blob Storage
    # as itself. No storage keys or connection strings in any secret.
    azure.workload.identity/client-id: ${AZURE_WORKLOAD_IDENTITY_CLIENT_ID}
  labels:
    azure.workload.identity/use: 'true'

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lih-api
  namespace: lih-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lih-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleUp:
      # Renewal reminders go out in batches and the resulting payment traffic
      # arrives in minutes, so scale up fast.
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
        - { type: Pods, value: 4, periodSeconds: 30 }
      selectPolicy: Max
    scaleDown:
      # Down slowly: shedding capacity into a second wave costs more than the
      # few minutes of extra nodes.
      stabilizationWindowSeconds: 300
      policies:
        - { type: Percent, value: 25, periodSeconds: 60 }

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: lih-api
  namespace: lih-production
spec:
  # Keeps a node drain or cluster upgrade from taking the API below two pods.
  minAvailable: 2
  selector:
    matchLabels:
      app: lih-api
