name: Release · Mobile (Android + iOS)

# Signed release builds. Distinct from the CI mobile job, which only produces
# an unsigned debug APK for validation.
#
# Android  → Google Play internal track → closed testing → production
# iOS      → TestFlight → App Store
#
# The TestFlight lane is what lets Bar Association members test the app before
# public release, which is the stated requirement.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to release
        required: true
        type: choice
        options: [both, android, ios]
      track:
        description: Android track / iOS destination
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.1'

jobs:
  # ==========================================================================
  android:
    name: Android — build and publish
    runs-on: ubuntu-latest
    if: inputs.platform != 'ios'
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore the upload keystore
        # The keystore is a repository secret holding base64 of the .jks. If
        # this key is ever lost, the app can never be updated on Play under
        # the same listing — keep an offline copy in the company safe as well.
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile-app/android/upload-keystore.jks
          cat > mobile-app/android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Resolve version from the tag
        id: version
        run: |
          # v1.4.2 -> name 1.4.2, build number from the run number so it
          # always increases (Play rejects a reused versionCode).
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=${TAG:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - run: cd mobile-app && flutter pub get

      - name: Test before shipping
        run: cd mobile-app && flutter test

      - name: Build App Bundle
        # Play requires .aab. The APK below is for side-loading during the
        # Bar Association pilot, where some testers are on networks that make
        # Play installs painful.
        run: |
          cd mobile-app
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=API_BASE_URL=https://api.lih.cm/v1 \
            --dart-define=DEFAULT_LOCALE=fr

      - name: Build APK for direct distribution
        run: |
          cd mobile-app
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=API_BASE_URL=https://api.lih.cm/v1 \
            --dart-define=DEFAULT_LOCALE=fr

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cm.lih.app
          releaseFiles: mobile-app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          # Both listings are maintained; Cameroon is officially bilingual and
          # a French-only Play listing would read as an oversight to half the Bar.
          whatsNewDirectory: mobile-app/distribution/whatsnew

      - uses: actions/upload-artifact@v7
        with:
          name: android-release-${{ steps.version.outputs.name }}
          path: |
            mobile-app/build/app/outputs/bundle/release/app-release.aab
            mobile-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Remove signing material from the runner
        if: always()
        run: rm -f mobile-app/android/upload-keystore.jks mobile-app/android/key.properties

  # ==========================================================================
  ios:
    name: iOS — build and publish to TestFlight
    runs-on: macos-14
    if: inputs.platform != 'android'
    environment: mobile-release
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "name=${TAG:-1.0.0}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Install the signing certificate and provisioning profile
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # A dedicated, ephemeral keychain. Never the login keychain — this
          # runner is disposable but the habit matters on shared machines.
          CERT_PATH=$RUNNER_TEMP/dist.p12
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          security import "$CERT_PATH" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - run: cd mobile-app && flutter pub get

      - name: Test before shipping
        run: cd mobile-app && flutter test

      - name: Build the iOS archive
        run: |
          cd mobile-app
          flutter build ipa --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.build }} \
            --dart-define=API_BASE_URL=https://api.lih.cm/v1 \
            --dart-define=DEFAULT_LOCALE=fr \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          # App Store Connect API key, not an Apple ID password: it is scoped,
          # revocable, and does not break when 2FA prompts.
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_KEY_BASE64" | base64 --decode \
            > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8

          xcrun altool --upload-app \
            --type ios \
            --file mobile-app/build/ios/ipa/*.ipa \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo "Uploaded. Apple processing usually takes 10-30 minutes,"
          echo "after which the build appears in TestFlight for the"
          echo "'Cameroon Bar Association Pilot' tester group."

      - uses: actions/upload-artifact@v7
        with:
          name: ios-release-${{ steps.version.outputs.name }}
          path: mobile-app/build/ios/ipa/*.ipa
          retention-days: 90

      - name: Clean up signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -rf ~/private_keys ~/Library/MobileDevice/Provisioning\ Profiles/*
