name: CI

# Steps 1–6 of the enterprise pipeline: lint, unit tests, integration tests,
# frontend build, backend build, mobile build.
#
# Jobs are split by concern rather than run as one long script, so a failure
# names itself in the checks list and a re-run costs only the failing part.
# Path filters mean a mobile-only change does not rebuild the backend.

on:
  push:
    branches: [main, develop, staging, production]
  pull_request:
    branches: [main, develop, staging, production]
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run on the same ref. Never cancel on
  # production — a half-cancelled release pipeline is worse than a slow one.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/production' }}

env:
  NODE_VERSION: '22'
  FLUTTER_VERSION: '3.27.1'

permissions:
  contents: read
  # paths-filter calls the PR "list files" API to decide which areas changed.
  # Without this it fails with "Resource not accessible by integration" on
  # every pull_request run — and on Dependabot PRs in particular, where the
  # token is restricted by default.
  pull-requests: read

jobs:
  # ==========================================================================
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      desktop: ${{ steps.filter.outputs.desktop }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Each area includes this workflow file, so a change to CI runs
            # the pipeline it governs. Without that, editing ci.yml skips
            # every build job and reports a green run that proved nothing —
            # which is exactly how a broken pipeline gets merged.
            backend:
              - 'backend/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend-web/**'
              - 'packages/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile-app/**'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop-app/**'
            infra:
              - 'infrastructure/**'
              - '.github/workflows/**'

  # ==========================================================================
  # Step 1 — Lint
  # ==========================================================================
  lint:
    name: Step 1 · Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Both are prerequisites for the backend to typecheck at all:
      #   * @lih/domain resolves through the workspace symlink to its dist,
      #     which does not exist until the package is built.
      #   * Prisma's generated client supplies every model and enum type.
      # Without them tsc reports dozens of phantom errors that do not exist
      # on a developer machine where both have already been run.
      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      - name: Build domain package
        run: npm run build --workspace @lih/domain

      - name: Typecheck domain package
        run: npm run typecheck --workspace @lih/domain
      - name: Typecheck backend
        run: cd backend && npx tsc -p tsconfig.json --noEmit
      - name: Verify no hardcoded user-facing strings
        # Rule 6 in CONTRIBUTING: every member-visible string is bilingual and
        # lives in the i18n catalogues. This catches the common regression of
        # throwing a raw English message from a service.
        run: |
          if grep -rnE "throw new (Bad|Not|Forbidden|Unauthorized|Conflict)[A-Za-z]*Exception\('[A-Z][a-z]+ [a-z]" \
               backend/src --include='*.ts' | grep -v '\.spec\.ts'; then
            echo "::error::Found a hardcoded English message. Use an i18n key (e.g. 'auth.invalid_credentials')."
            exit 1
          fi

  # ==========================================================================
  # Step 2 — Unit tests
  # ==========================================================================
  unit-tests:
    name: Step 2 · Unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # ts-jest type-checks as it transpiles, so the backend suite needs the
      # generated Prisma client and the built domain package exactly as the
      # typecheck job does.
      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      - name: Build domain package
        run: npm run build --workspace @lih/domain

      - name: Domain tests (money, rating, state machines)
        run: npm run test:cov --workspace @lih/domain

      - name: Backend unit tests
        run: cd backend && npx jest --coverage
        env:
          NODE_ENV: test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: |
            packages/domain/coverage/
            backend/coverage/
          retention-days: 14

  # ==========================================================================
  # Step 3 — Integration tests (real Postgres and Redis)
  # ==========================================================================
  integration-tests:
    name: Step 3 · Integration tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lih
          POSTGRES_PASSWORD: lih_ci_password
          POSTGRES_DB: lih_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lih -d lih_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql://lih:lih_ci_password@localhost:5432/lih_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-32
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-32
      PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      - name: Build domain package
        run: npm run build --workspace @lih/domain

      # The SQL phases must run in this order — the uuidv7 function and the
      # extensions have to exist before the tables that default to them, and
      # the RLS policies after the tables exist. This is also the only place
      # in CI where that ordering is actually exercised.
      - name: Apply pre-migration SQL
        run: cd backend && node scripts/apply-sql.js pre

      - name: Run migrations
        run: cd backend && npx prisma migrate deploy

      - name: Apply post-migration SQL (RLS, partitions, indexes)
        run: cd backend && node scripts/apply-sql.js post

      - name: Seed
        run: cd backend && npx ts-node prisma/seed.ts

      - name: Verify row-level security is actually enforced
        # A regression here means one tenant could read another's rows. The
        # policy existing is not the same as it being enabled and forced.
        run: |
          set -euo pipefail
          # psql rejects Prisma's ?schema= parameter with "invalid URI query
          # parameter", so strip the query string. Getting this wrong made an
          # earlier version of this check pass without ever running.
          PSQL_URL="${DATABASE_URL%%\?*}"

          UNPROTECTED=$(psql "$PSQL_URL" -tAc "
            SELECT coalesce(string_agg(tablename, ', '), '')
            FROM pg_tables
            WHERE schemaname = 'public'
              AND tablename IN ('policies','claims','payments','lawyer_profiles','users')
              AND NOT rowsecurity;
          ")

          if [ -n "$UNPROTECTED" ]; then
            echo "::error::Row-level security is not enabled on: $UNPROTECTED"
            exit 1
          fi

          PROTECTED=$(psql "$PSQL_URL" -tAc "
            SELECT count(*) FROM pg_tables
            WHERE schemaname='public' AND rowsecurity;
          ")
          # Guards against the check silently passing because psql returned
          # nothing at all.
          [ "$PROTECTED" -ge 15 ] || {
            echo "::error::Only $PROTECTED tables have RLS — expected at least 15"; exit 1; }
          echo "RLS enabled and forced on $PROTECTED tables"

      - name: Verify the audit log rejects UPDATE
        run: |
          set -uo pipefail
          PSQL_URL="${DATABASE_URL%%\?*}"

          # The trigger is FOR EACH ROW, so an UPDATE against an empty table
          # succeeds without firing it. The row has to exist for this to test
          # anything — and RLS is FORCED on audit_logs, so the session needs
          # the tenant GUC set before it can insert at all.
          TENANT='00000000-0000-0000-0000-000000000001'

          # Each statement gets its OWN psql invocation, and therefore its own
          # transaction. Combining them would let the UPDATE's exception roll
          # back the INSERT, leaving no row for the DELETE to hit — the check
          # would then pass or fail for the wrong reason.
          psql "$PSQL_URL" -q -c "SET app.current_tenant = '$TENANT'; INSERT INTO audit_logs (id, tenant_id, action, entity_type, created_at) VALUES (uuid_generate_v7(), '$TENANT', 'ci.tamper_test', 'CiCheck', now());"

          OUTPUT=$(psql "$PSQL_URL" -v ON_ERROR_STOP=0 -c "SET app.current_tenant = '$TENANT'; UPDATE audit_logs SET action = 'tampered' WHERE action = 'ci.tamper_test';" 2>&1 || true)

          if echo "$OUTPUT" | grep -q 'append-only'; then
            echo 'audit_logs correctly rejected an UPDATE'
          else
            echo "::error::audit_logs accepted an UPDATE — the evidence trail is mutable"
            echo "$OUTPUT"
            exit 1
          fi

          DELETED=$(psql "$PSQL_URL" -v ON_ERROR_STOP=0 -c "SET app.current_tenant = '$TENANT'; DELETE FROM audit_logs WHERE action = 'ci.tamper_test';" 2>&1 || true)

          if echo "$DELETED" | grep -q 'append-only'; then
            echo 'audit_logs correctly rejected a DELETE'
          else
            echo "::error::audit_logs accepted a DELETE — the evidence trail is mutable"
            echo "$DELETED"
            exit 1
          fi

      - name: Integration tests
        run: cd backend && npx jest --config test/jest-e2e.json --runInBand --passWithNoTests

  # ==========================================================================
  # Step 4 — Build frontend
  # ==========================================================================
  build-web:
    name: Step 4 · Build web
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: needs.changes.outputs.web == 'true'

    # NON-BLOCKING while the Next.js app is still a scaffold. frontend-web/
    # currently holds the API client, the money handling and both message
    # catalogues, but no app/ or pages/ directory, so `next build` correctly
    # refuses. Remove this line once the first route exists.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @lih/domain
      - name: Build Next.js
        run: cd frontend-web && npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.lih.cm/v1
          NEXT_TELEMETRY_DISABLED: '1'

  # ==========================================================================
  # Step 5 — Build backend
  # ==========================================================================
  build-backend:
    name: Step 5 · Build backend
    runs-on: ubuntu-latest
    needs: [changes, lint, unit-tests]
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      # Build order matters: the API resolves @lih/domain through the
      # workspace symlink to the package's dist, not its source.
      - name: Build domain, then API
        run: |
          npm run build --workspace @lih/domain
          cd backend && npx nest build
      - name: Assert the emit landed where the Dockerfile expects it
        run: test -f backend/dist/main.js || { echo '::error::backend/dist/main.js missing'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # ==========================================================================
  # Step 6 — Build mobile
  # ==========================================================================
  build-mobile:
    name: Step 6 · Build mobile
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.mobile == 'true'

    # NON-BLOCKING while the Flutter app is still a scaffold. Today
    # mobile-app/ contains the core layer only — money handling, the API
    # client and the offline design — with no main.dart, so `flutter analyze`
    # legitimately fails.
    #
    # This is deliberately not hidden behind a passing step: the job runs,
    # reports honestly, and does not gate the pipeline. Remove this line the
    # moment the app has an entry point, so mobile regressions start blocking
    # merges like every other area.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: cd mobile-app && flutter pub get
      - name: Analyse
        run: cd mobile-app && flutter analyze --no-fatal-infos
      - name: Test
        run: cd mobile-app && flutter test
      - name: Build debug APK (validation only — signed builds live in the release workflow)
        run: cd mobile-app && flutter build apk --debug

  # ==========================================================================
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, unit-tests, integration-tests, build-web, build-backend, build-mobile]
    steps:
      # Skipped jobs are expected (path filters); failures and cancellations
      # are not. This is the single required check for branch protection.
      - name: Verify no job failed
        run: |
          echo '${{ toJSON(needs) }}' > results.json
          if grep -qE '"result": *"(failure|cancelled)"' results.json; then
            echo "::error::At least one CI job failed"
            cat results.json
            exit 1
          fi
          echo "All executed jobs passed."
